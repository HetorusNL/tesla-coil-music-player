[project]
name = "tesla-coil-music-player"
version = "0.1.0"
description = ""
authors = [{ name = "Tim Klein Nijenhuis", email = "tim@hetorus.nl" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mido>=1.3.3",
    "nicegui>=3.18.0",
    "pyserial>=3.5",
]

[project.scripts]
tesla-coil-gui = "gui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gui"]

[tool.black]
line-length = 120

[dependency-groups]
dev = ["black>=26.10.1"]
