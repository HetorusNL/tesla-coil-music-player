[project]
name = "tesla-coil-music-player"
version = "0.1.0"
description = ""
authors = [{ name = "Tim Klein Nijenhuis", email = "tim@hetorus.nl" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mido>=1.3.3",
    "nicegui>=3.18.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
convert = [
    "basic-pitch[onnx]>=0.4.0",
    "soundfile>=0.13.1",
    # PyTorch has no Python 3.14 builds for Intel Macs, the converter only works with --no-separate there
    "demucs>=4.1.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[project.scripts]
tesla-coil-gui = "gui.__main__:main"
tesla-coil-convert = "converter.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gui", "converter"]

[tool.black]
line-length = 120

[dependency-groups]
dev = ["black>=26.10.1"]

[tool.uv]
# basic-pitch pulls in tensorflow (no Python 3.14 wheels) and coremltools, which the ONNX model doesn't need,
# the impossible marker drops them. Its resampy pin needs pkg_resources, which newer setuptools no longer ships
override-dependencies = [
    "resampy>=0.4.3",
    # demucs pins an old PyTorch on Intel Macs, which has no Python 3.14 builds
    "torch; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "tensorflow; python_version < '3'",
    "tensorflow-macos; python_version < '3'",
    "coremltools; python_version < '3'",
]

# PyTorch for demucs, the CPU build is a fraction of the size of the default CUDA one
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
