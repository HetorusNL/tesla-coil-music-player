; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = controller/src
include_dir = controller/include
default_envs = nucleo

[env:nucleo]
platform = ststm32
board = nucleo_f746zg
framework = arduino
monitor_speed = 921600
; the SparkGenerator drives TIM2 and TIM4 itself, so leave out HardwareTimer and its interrupt handlers, and buffer
; a few frames of the protocol (the core buffers only 64 bytes by default)
build_flags = -DHAL_TIM_MODULE_ONLY -DSERIAL_RX_BUFFER_SIZE=1024 -DSERIAL_TX_BUFFER_SIZE=1024

; test firmware for the hardware tests (uv run pytest --port /dev/ttyACM0), wire the coil pin D10 to A0 and
; disconnect the coil
[env:nucleo_spark_test]
extends = env:nucleo
build_flags = ${env:nucleo.build_flags} -DSPARK_TEST
